name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject guest list write key
        env:
          GUEST_WRITE_TOKEN: ${{ secrets.GUEST_WRITE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          token = (os.environ.get("GUEST_WRITE_TOKEN") or "").strip()
          if not token:
              sys.exit(
                  "GUEST_WRITE_TOKEN is empty. Set it with: gh secret set GUEST_WRITE_TOKEN"
              )
          with open("token.js", "w", encoding="utf-8") as handle:
              handle.write("window.CHOCO_WRITE_TOKEN = " + json.dumps(token) + ";\n")
          print("token.js written")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
